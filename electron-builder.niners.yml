# Niners Academy — white-label desktop build config.
# ----------------------------------------------------------------------------
# Used via `electron-builder --config electron-builder.niners.yml` AFTER the
# runner is built with VITE_CENTER_ID=niners and the main bundle with
# FLAVOR=niners (see the dist:niners npm script). Mirrors electron-builder.yml
# but with Niners Academy identity, its own icon, deep-link scheme, and its
# OWN release bucket so niners and Mock Stream auto-updates never cross.
appId: app.mockstream.niners.desktop
productName: Niners Academy
# Frozen at 1.0.161 — the last build this clone ever gets.
# ----------------------------------------------------------------------------
# From here the app moves onto the shared Mock Stream build: AppShell shows the
# migration notice once this centre's config turns `desktopMigration` on, and
# main/migrate.ts then fetches the shared app from ITS feed and installs over
# this one. electron-updater refuses a feed that is not NEWER than the running
# app and `allowDowngrade` does not cover an equal version, so this number has
# to stay BELOW the shared app's (1.1.1) or the move dies on
# "update-not-available" — which is exactly what happened on 2026-10-23.
# Detaching it from package.json also means a later Mock Stream release cannot
# drag the clones along by accident.
extraMetadata:
  version: 1.0.161

directories:
  output: dist
  buildResources: build
artifactName: NinersAcademy-Setup-${version}.${ext}
# Auto-update feed on R2 (free egress), moved with this centre's first R2
# release — release:niners uploads here in the same run, so the feed exists
# before any app built from this config is installed. GCS still receives every
# release, for apps installed before the switch.
publish:
  provider: generic
  url: https://audio.mock-stream.com/desktop/niners
# niners' OWN custom protocol (matches the mobile niners scheme) for the
# Telegram bridge deep-link return — never collides with Mock Stream's
# `mockstream://`.
protocols:
  - name: Niners Academy Protocol
    schemes:
      - mockstreamniners
files:
  - out/**/*
# Bundle the niners-flavored runner build (built with VITE_CENTER_ID=niners).
extraResources:
  - from: ../mockstream-runner/dist
    to: runner
    filter:
      - '**/*'
win:
  target: nsis
  icon: build/niners/icon.png
mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.education
  icon: build/niners/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Mic prompt for the Speaking exam (else macOS silently denies the mic).
  extendInfo:
    NSMicrophoneUsageDescription: Niners Academy needs the microphone to record your spoken answers during Speaking mock exams.
  notarize: true
