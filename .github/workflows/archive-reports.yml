# Nightly copy of the Supabase `reports` bucket (student reports + speaking
# audio) into gs://mockstream-report-archive (Coldline) BEFORE the
# storage-cleanup function's retention window deletes them. Idempotent:
# each run archives whatever the bucket has that GCS doesn't.
#
# Secrets: GCP_SA_KEY (same SA as releases, has objectAdmin on the archive
# bucket), ARCHIVE_LIST_TOKEN (matches site_settings.archive_list_token).
name: archive-reports

on:
  schedule:
    - cron: "30 20 * * *"   # 01:30 Tashkent, well before the nightly cleanup
  workflow_dispatch:

concurrency:
  group: archive-reports
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/archive-reports

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Archive new reports to GCS
        env:
          ARCHIVE_LIST_TOKEN: ${{ secrets.ARCHIVE_LIST_TOKEN }}
        run: python tools/archive-reports/archive.py
