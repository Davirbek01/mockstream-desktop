# Bekzods Multilevel — white-label desktop build config.
# ----------------------------------------------------------------------------
# Used via `electron-builder --config electron-builder.bek.yml` AFTER the runner
# is built with VITE_CENTER_ID=bek and the main bundle with FLAVOR=bek (see the
# dist:bek npm script). Mirrors electron-builder.yml but with bek identity, its
# own icon, deep-link scheme, and its OWN release bucket so bek and Mock Stream
# auto-updates never cross.
appId: app.mockstream.bek.desktop
productName: Bekzods Multilevel
directories:
  output: dist
  buildResources: build
artifactName: Bekzods-Setup-${version}.${ext}
# Auto-update feed on R2 (free egress), moved with this centre's first R2
# release — release:bek uploads here in the same run, so the feed exists before
# any app built from this config is installed. GCS still receives every release,
# for apps installed before the switch.
publish:
  provider: generic
  url: https://audio.mock-stream.com/desktop/bekzods
# bek's OWN custom protocol (matches the mobile bek scheme) for the Telegram
# bridge deep-link return — never collides with Mock Stream's `mockstream://`.
protocols:
  - name: Bekzods Multilevel Protocol
    schemes:
      - mockstreambek
files:
  - out/**/*
# Bundle the bek-flavored runner build (built with VITE_CENTER_ID=bek).
extraResources:
  - from: ../mockstream-runner/dist
    to: runner
    filter:
      - '**/*'
win:
  target: nsis
  icon: build/bek/icon.png
mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.education
  icon: build/bek/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Mic prompt for the Speaking exam (else macOS silently denies the mic).
  extendInfo:
    NSMicrophoneUsageDescription: Bekzods Multilevel needs the microphone to record your spoken answers during Speaking mock exams.
  notarize: true
