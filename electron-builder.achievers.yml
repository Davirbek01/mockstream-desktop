# Achievers Academy — white-label desktop build config.
# ----------------------------------------------------------------------------
# Used via `electron-builder --config electron-builder.achievers.yml` AFTER the
# runner is built with VITE_CENTER_ID=achievers and the main bundle with
# FLAVOR=achievers (see the dist:achievers npm script). Mirrors electron-builder.yml
# but with Achievers Academy identity, its own icon, deep-link scheme, and its
# OWN release bucket so achievers and Mock Stream auto-updates never cross.
appId: app.mockstream.achievers.desktop
productName: Achievers Academy
# Frozen at 1.0.161 — the last build this clone ever gets.
# ----------------------------------------------------------------------------
# From here the app moves onto the shared Mock Stream build: AppShell shows the
# migration notice once this centre's config turns `desktopMigration` on, and
# main/migrate.ts then fetches the shared app from ITS feed and installs over
# this one. electron-updater refuses a feed that is not NEWER than the running
# app and `allowDowngrade` does not cover an equal version, so this number has
# to stay BELOW the shared app's (1.1.1) or the move dies on
# "update-not-available" — which is exactly what happened on 2026-10-23.
# Detaching it from package.json also means a later Mock Stream release cannot
# drag the clones along by accident.
extraMetadata:
  version: 1.0.161

directories:
  output: dist
  buildResources: build
artifactName: AchieversAcademy-Setup-${version}.${ext}
# Auto-update feed on R2 (free egress), moved with this centre's first R2
# release — release:achievers uploads here in the same run, so the feed exists
# before any app built from this config is installed. GCS still receives every
# release, for apps installed before the switch.
publish:
  provider: generic
  url: https://audio.mock-stream.com/desktop/achievers
# achievers' OWN custom protocol (matches the mobile achievers scheme) for the
# Telegram bridge deep-link return — never collides with Mock Stream's
# `mockstream://`.
protocols:
  - name: Achievers Academy Protocol
    schemes:
      - mockstreamachievers
files:
  - out/**/*
# Bundle the achievers-flavored runner build (built with VITE_CENTER_ID=achievers).
extraResources:
  - from: ../mockstream-runner/dist
    to: runner
    filter:
      - '**/*'
win:
  target: nsis
  icon: build/achievers/icon.png
mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.education
  icon: build/achievers/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Mic prompt for the Speaking exam (else macOS silently denies the mic).
  extendInfo:
    NSMicrophoneUsageDescription: Achievers Academy needs the microphone to record your spoken answers during Speaking mock exams.
  notarize: true
